name: Reusable Code CI (Grade A - code repo)
on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: '3.11'
        type: string
      # ★S1-A（Kevin L0 2026-08-31 裁 3）：兩者 default false ⇒ 未設定之庫行為與改前逐字相同。
      collect_root_tests:
        # true 時併收庫根之 test_*.py / *_test.py（治「只收 tests/ 之受檢母體缺口」，PENDING-645）
        required: false
        default: false
        type: boolean
      extra_test_paths:
        # 空白分隔之額外測試目錄（例：website-content/tests products/cmg/content-matrix-generator/tests）；僅 collect_root_tests=true 時併入收集（IN-37 W5）
        required: false
        default: ''
        type: string
      strict_tests:
        # true 時 pytest job 失敗必擋（關閉 continue-on-error）。
        # ★與 ADR-0251（P-LEAN 品質類降 L1 不阻 commit）之關係：採**單庫例外**，ADR 本體不改
        #   （Kevin L0 2026-08-31 裁 2）。理由＝0251 之 P-LEAN 針對非生產庫；
        #   走向 PROD_GATE 之產物不得跑在非阻擋測試上。P-OS 進 REAL 前重議 0251。
        required: false
        default: false
        type: boolean
      # ★2026-10-19（v2，外部工程師 A）：私有依賴。default 空白 ⇒ 不取權杖，安裝步驟與改前逐字相同（他庫零行為變更，同 S1-A 做法）。
      private_repos:
        # 逗號分隔（不加空白）之同 org 私有庫名（例：prospera-engine-runtime,prospera-data-architecture）：以 GitHub App 唯讀權杖
        # 取各庫 main，放在本庫旁（../<庫名>，同本機與各庫映像之相鄰目錄配置），以 .pth 加入匯入路徑（有 src/ 者加 src/）。
        # 2026-10-21 改：原為「pip 安裝 requirements.txt 內之 git 依賴時用權杖」，但各庫 requirements.txt 改為附雜湊（pip 雜湊模式不收 git 依賴）後不再適用。
        # 不以套件名安裝（私有庫不在公開 PyPI，防依賴混淆）、不經建置後端；私有庫之第三方依賴須在本庫 requirements.txt。
        required: false
        default: ''
        type: string
      postgres:
        # true 時於測試前啟動測試用 PostgreSQL（只綁本機），pytest 以環境變數 PROSPERA_TEST_PG_URL 連線（2026-10-21，v2）
        required: false
        default: false
        type: boolean
      app_id:
        # GitHub App 編號（呼叫端傳 vars.PROSPERA_AI_APP_ID）；private_repos 非空白時必填
        required: false
        default: ''
        type: string
    secrets:
      app_private_key:
        # GitHub App 私鑰（呼叫端傳 secrets.PROSPERA_AI_APP_PRIVATE_KEY）；private_repos 非空白時必填
        required: false

concurrency:
  group: code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ★S1-A：strict_tests=true ⇒ continue-on-error 為 false（失敗必擋）；未設定者仍為 true，行為同改前（ADR-0251 P-LEAN:品質類降L1(nightly追),不阻commit）。
    continue-on-error: ${{ !inputs.strict_tests }}
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          # cache: 'pip' 移除：無 requirements.txt/pyproject.toml 的 repo 會硬掛 setup（fleet CI 紅根因，2026-07-05）
      - name: 私有依賴權杖（唯讀，僅 private_repos 非空白時）
        id: app_token
        if: inputs.private_repos != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private_repos }}
          permission-contents: read
      - name: Install deps
        run: |
          pip install pytest 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          # DNA v2 D3（W4／GAP-20，2026-09-26）：有 pyproject.toml 之庫安裝本庫套件（--no-deps），測試以套件名匯入，
          # 各庫之「未安裝時以路徑平面載入」過渡相容段方可移除；無 pyproject.toml 者行為不變
          if [ -f pyproject.toml ]; then pip install --no-deps -e . || { echo "::error::本庫套件安裝失敗（pip install -e .）"; exit 1; }; fi
      - name: 私有依賴（取各庫 main 放在本庫旁，加入匯入路徑；僅 private_repos 非空白時）
        if: inputs.private_repos != ''
        env:
          PRIVATE_REPOS: ${{ inputs.private_repos }}
          PRIVATE_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          PTH="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/prospera_private.pth"
          : > "$PTH"
          for name in ${PRIVATE_REPOS//,/ }; do
            dir="$(dirname "$GITHUB_WORKSPACE")/$name"
            # 權杖只經環境變數給這一個 git 指令（不寫入任何 git 設定檔，後續測試讀不到）；取不到即失敗，不吞錯
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="url.https://x-access-token:${PRIVATE_TOKEN}@github.com/.insteadOf" \
            GIT_CONFIG_VALUE_0="https://github.com/" \
              git clone -q --depth 1 "https://github.com/$OWNER/$name" "$dir" || { echo "::error::私有庫 $name 取不到（App 須能讀此庫）"; exit 1; }
            if [ -d "$dir/src" ]; then echo "$dir/src"; else echo "$dir"; fi >> "$PTH"
            echo "$name：$(git -C "$dir" rev-parse HEAD)"   # 本次測到之私有庫版本
          done
      - name: 測試用 PostgreSQL（僅 postgres=true；只綁本機）
        if: inputs.postgres
        run: |
          set -euo pipefail
          # 版本同 prospera-os deploy/compose.yaml（digest 釘死）
          docker run -d --name ci-pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=test \
            postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          # 經 TCP 檢查：映像初始化時之暫時伺服器只聽 Unix socket，TCP 通了才是正式啟動
          for _ in $(seq 60); do docker exec ci-pg pg_isready -q -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec ci-pg pg_isready -h 127.0.0.1 -U postgres
          echo "PROSPERA_TEST_PG_URL=postgresql://postgres:test@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: pytest
        # ★274 修遮罩：原 `A || B || echo` 使失敗恆被 echo 吞成 exit0（結構不可能紅=假閘）。
        # 改為「跑存在的測試目錄，讓其 exit code 浮現」——通用邏輯非 repo-specific 路徑、
        # 非放寬全域收集；保留「無測試目錄→skip」fallback。continue-on-error 仍在（ADR-0251
        # 品質類非阻斷），但紅可見（真陰真陽 run 為證）。
        env:
          COLLECT_ROOT_TESTS: ${{ inputs.collect_root_tests }}
          EXTRA_TEST_PATHS: ${{ inputs.extra_test_paths }}
        run: |
          set -e
          if [ "$COLLECT_ROOT_TESTS" != "true" ]; then
            # ★預設路徑：內層三分支指令與改前逐字相同（他庫零行為變更）
            if [ -d 11_tests ]; then
              python -m pytest 11_tests/ -q --tb=short
            elif [ -d tests ]; then
              python -m pytest tests/ -q --tb=short
            else
              echo "✅ 無測試目錄，跳過"
            fi
            exit 0
          fi
          # ★collect_root_tests=true：三處併收，並印出實際收集範圍
          # （用 if/fi 非 `[ -d x ] && y`：後者在 set -e 下之退出語意有歧義，不留問號）
          TARGETS=""
          if [ -d 11_tests ]; then TARGETS="$TARGETS 11_tests"; fi
          if [ -d tests ]; then TARGETS="$TARGETS tests"; fi
          ROOTT="$(ls -1 test_*.py 2>/dev/null || true) $(ls -1 *_test.py 2>/dev/null || true)"
          for d in $EXTRA_TEST_PATHS; do if [ -e "$d" ]; then TARGETS="$TARGETS $d"; else echo "::error::extra_test_paths 指定之 $d 不存在"; exit 1; fi; done
          TARGETS="$(echo $TARGETS $ROOTT | xargs || true)"
          if [ -z "$TARGETS" ]; then
            echo "✅ 三處皆無測試目標，跳過"
            exit 0
          fi
          echo "pytest targets: $TARGETS"
          python -m pytest $TARGETS -q --tb=short

  # ★2026-09-18 L0 裁示：原 detect-simplified（簡體字 grep）已拆除，
  #   字形檢查只在治理庫交付出口 00_governance/delivery_exit/convert_and_check。
  #   保留同名 job 且恆略過（`if: false`），**不做任何檢查**：prospera-product-gengrant、
  #   prospera-product-client-template 之分支保護必要檢查仍含「ci / detect-simplified」，
  #   略過之 job 回報為 skipped，GitHub 不因此擋合併，且不佔 runner。
  #   兩庫自必要檢查移除該項後，本 job 整段刪除。
  detect-simplified:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "本 job 不做任何檢查"

  llm-chokepoint:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: LLM Chokepoint Guard
        run: |
          python3 - <<'PY'
          import os, sys, re
          BAD = re.compile(r'anthropic\.Anthropic|Anthropic\(\)|client\.messages\.create|openai\.ChatCompletion')
          violations = []
          # 允許的 chokepoint 本體(api_utils / llm_client / 標 '# llm-chokepoint: allow' 者)
          CHOKEPOINTS = ('api_utils.py', 'llm_client.py')
          for root, _, files in os.walk('.'):
              if '.git' in root or 'api_utils' in root or '99_archive' in root or 'node_modules' in root or 'dev_scratch' in root:
                  continue
              for f in files:
                  if f.endswith('.py') and f not in CHOKEPOINTS:
                      content = open(os.path.join(root, f), encoding='utf-8', errors='ignore').read()
                      if '# llm-chokepoint: allow' in content:
                          continue  # 顯式允許例外(需 review)
                      if BAD.search(content):
                          violations.append(os.path.join(root, f))
          if violations:
              print('❌ 直接 LLM 呼叫（繞過 chokepoint）：', violations); sys.exit(1)
          print('✅ LLM Chokepoint 檢查通過')
          PY

  # GOVERNANCE_PLAN 波 2（2026-09-25）：秘密掃描實際執行（I4 secret_scan_executed）。做法同治理庫 secret_scan.yml。
  #   非必要檢查，不加入任何分支保護必要清單；有外洩即本 job 紅燈。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks（本次變更範圍）
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$SHA~1..$SHA"
          else
            RANGE="$BEFORE..$SHA"
          fi
          VER=8.18.4
          curl -sSL -o /tmp/gl.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  /tmp/gl.tar.gz" | sha256sum -c -   # 官方 checksums.txt 之 linux_x64；換 VER 時一併更新
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks && sudo mv /tmp/gitleaks /usr/local/bin/
          CFG=""
          if [ -f .gitleaks.toml ]; then CFG="--config .gitleaks.toml"; fi
          if ! git cat-file -e "${RANGE%%..*}^{commit}" 2>/dev/null; then RANGE="$SHA"; fi
          gitleaks detect $CFG --log-opts="$RANGE" --redact -v --exit-code 1
