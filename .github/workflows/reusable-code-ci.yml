name: Reusable Code CI (Grade A - code repo)
on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: '3.11'
        type: string
      # ★S1-A（Kevin L0 2026-08-31 裁 3）：兩者 default false ⇒ 未設定之庫行為與改前逐字相同。
      collect_root_tests:
        # true 時併收庫根之 test_*.py / *_test.py（治「只收 tests/ 之受檢母體缺口」，PENDING-645）
        required: false
        default: false
        type: boolean
      strict_tests:
        # true 時 pytest job 失敗必擋（關閉 continue-on-error）。
        # ★與 ADR-0251（P-LEAN 品質類降 L1 不阻 commit）之關係：採**單庫例外**，ADR 本體不改
        #   （Kevin L0 2026-08-31 裁 2）。理由＝0251 之 P-LEAN 針對非生產庫；
        #   走向 PROD_GATE 之產物不得跑在非阻擋測試上。P-OS 進 REAL 前重議 0251。
        required: false
        default: false
        type: boolean

concurrency:
  group: code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ★S1-A：strict_tests=true ⇒ continue-on-error 為 false（失敗必擋）；未設定者仍為 true，行為同改前（ADR-0251 P-LEAN:品質類降L1(nightly追),不阻commit）。
    continue-on-error: ${{ !inputs.strict_tests }}
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          # cache: 'pip' 移除：無 requirements.txt/pyproject.toml 的 repo 會硬掛 setup（fleet CI 紅根因，2026-07-05）
      - name: Install deps
        run: |
          pip install pytest 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
      - name: pytest
        # ★274 修遮罩：原 `A || B || echo` 使失敗恆被 echo 吞成 exit0（結構不可能紅=假閘）。
        # 改為「跑存在的測試目錄，讓其 exit code 浮現」——通用邏輯非 repo-specific 路徑、
        # 非放寬全域收集；保留「無測試目錄→skip」fallback。continue-on-error 仍在（ADR-0251
        # 品質類非阻斷），但紅可見（真陰真陽 run 為證）。
        env:
          COLLECT_ROOT_TESTS: ${{ inputs.collect_root_tests }}
        run: |
          set -e
          if [ "$COLLECT_ROOT_TESTS" != "true" ]; then
            # ★預設路徑：內層三分支指令與改前逐字相同（他庫零行為變更）
            if [ -d 11_tests ]; then
              python -m pytest 11_tests/ -q --tb=short
            elif [ -d tests ]; then
              python -m pytest tests/ -q --tb=short
            else
              echo "✅ 無測試目錄，跳過"
            fi
            exit 0
          fi
          # ★collect_root_tests=true：三處併收，並印出實際收集範圍
          # （用 if/fi 非 `[ -d x ] && y`：後者在 set -e 下之退出語意有歧義，不留問號）
          TARGETS=""
          if [ -d 11_tests ]; then TARGETS="$TARGETS 11_tests"; fi
          if [ -d tests ]; then TARGETS="$TARGETS tests"; fi
          ROOTT="$(ls -1 test_*.py 2>/dev/null || true) $(ls -1 *_test.py 2>/dev/null || true)"
          TARGETS="$(echo $TARGETS $ROOTT | xargs || true)"
          if [ -z "$TARGETS" ]; then
            echo "✅ 三處皆無測試目標，跳過"
            exit 0
          fi
          echo "pytest targets: $TARGETS"
          python -m pytest $TARGETS -q --tb=short

  detect-simplified:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 繁體中文強制閘
        run: |
          if grep -rP '这|说|项|实|该|与|对|从|将|应' \
            --include='*.md' --include='*.py' . 2>/dev/null | grep -v '.git'; then
            echo "❌ 發現簡體中文"
            exit 1
          fi
          echo "✅ 繁體中文檢查通過"

  llm-chokepoint:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: LLM Chokepoint Guard
        run: |
          python3 - <<'PY'
          import os, sys, re
          BAD = re.compile(r'anthropic\.Anthropic|Anthropic\(\)|client\.messages\.create|openai\.ChatCompletion')
          violations = []
          # 允許的 chokepoint 本體(api_utils / llm_client / 標 '# llm-chokepoint: allow' 者)
          CHOKEPOINTS = ('api_utils.py', 'llm_client.py')
          for root, _, files in os.walk('.'):
              if '.git' in root or 'api_utils' in root or '99_archive' in root or 'node_modules' in root or 'dev_scratch' in root:
                  continue
              for f in files:
                  if f.endswith('.py') and f not in CHOKEPOINTS:
                      content = open(os.path.join(root, f), encoding='utf-8', errors='ignore').read()
                      if '# llm-chokepoint: allow' in content:
                          continue  # 顯式允許例外(需 review)
                      if BAD.search(content):
                          violations.append(os.path.join(root, f))
          if violations:
              print('❌ 直接 LLM 呼叫（繞過 chokepoint）：', violations); sys.exit(1)
          print('✅ LLM Chokepoint 檢查通過')
          PY
