name: Reusable Code CI (Grade A - code repo)
on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: '3.11'
        type: string
      # ★S1-A（Kevin L0 2026-08-31 裁 3）：兩者 default false ⇒ 未設定之庫行為與改前逐字相同。
      collect_root_tests:
        # true 時併收庫根之 test_*.py / *_test.py（治「只收 tests/ 之受檢母體缺口」，PENDING-645）
        required: false
        default: false
        type: boolean
      strict_tests:
        # true 時 pytest job 失敗必擋（關閉 continue-on-error）。
        # ★與 ADR-0251（P-LEAN 品質類降 L1 不阻 commit）之關係：採**單庫例外**，ADR 本體不改
        #   （Kevin L0 2026-08-31 裁 2）。理由＝0251 之 P-LEAN 針對非生產庫；
        #   走向 PROD_GATE 之產物不得跑在非阻擋測試上。P-OS 進 REAL 前重議 0251。
        required: false
        default: false
        type: boolean

concurrency:
  group: code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ★S1-A：strict_tests=true ⇒ continue-on-error 為 false（失敗必擋）；未設定者仍為 true，行為同改前（ADR-0251 P-LEAN:品質類降L1(nightly追),不阻commit）。
    continue-on-error: ${{ !inputs.strict_tests }}
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          # cache: 'pip' 移除：無 requirements.txt/pyproject.toml 的 repo 會硬掛 setup（fleet CI 紅根因，2026-07-05）
      - name: Install deps
        run: |
          pip install pytest 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          # DNA v2 D3（W4／GAP-20，2026-09-26）：有 pyproject.toml 之庫安裝本庫套件（--no-deps），測試以套件名匯入，
          # 各庫之「未安裝時以路徑平面載入」過渡相容段方可移除；無 pyproject.toml 者行為不變
          if [ -f pyproject.toml ]; then pip install --no-deps -e . || { echo "::error::本庫套件安裝失敗（pip install -e .）"; exit 1; }; fi
      - name: pytest
        # ★274 修遮罩：原 `A || B || echo` 使失敗恆被 echo 吞成 exit0（結構不可能紅=假閘）。
        # 改為「跑存在的測試目錄，讓其 exit code 浮現」——通用邏輯非 repo-specific 路徑、
        # 非放寬全域收集；保留「無測試目錄→skip」fallback。continue-on-error 仍在（ADR-0251
        # 品質類非阻斷），但紅可見（真陰真陽 run 為證）。
        env:
          COLLECT_ROOT_TESTS: ${{ inputs.collect_root_tests }}
        run: |
          set -e
          if [ "$COLLECT_ROOT_TESTS" != "true" ]; then
            # ★預設路徑：內層三分支指令與改前逐字相同（他庫零行為變更）
            if [ -d 11_tests ]; then
              python -m pytest 11_tests/ -q --tb=short
            elif [ -d tests ]; then
              python -m pytest tests/ -q --tb=short
            else
              echo "✅ 無測試目錄，跳過"
            fi
            exit 0
          fi
          # ★collect_root_tests=true：三處併收，並印出實際收集範圍
          # （用 if/fi 非 `[ -d x ] && y`：後者在 set -e 下之退出語意有歧義，不留問號）
          TARGETS=""
          if [ -d 11_tests ]; then TARGETS="$TARGETS 11_tests"; fi
          if [ -d tests ]; then TARGETS="$TARGETS tests"; fi
          ROOTT="$(ls -1 test_*.py 2>/dev/null || true) $(ls -1 *_test.py 2>/dev/null || true)"
          TARGETS="$(echo $TARGETS $ROOTT | xargs || true)"
          if [ -z "$TARGETS" ]; then
            echo "✅ 三處皆無測試目標，跳過"
            exit 0
          fi
          echo "pytest targets: $TARGETS"
          python -m pytest $TARGETS -q --tb=short

  # ★2026-09-18 L0 裁示：原 detect-simplified（簡體字 grep）已拆除，
  #   字形檢查只在治理庫交付出口 00_governance/delivery_exit/convert_and_check。
  #   保留同名 job 且恆略過（`if: false`），**不做任何檢查**：prospera-product-gengrant、
  #   prospera-product-client-template 之分支保護必要檢查仍含「ci / detect-simplified」，
  #   略過之 job 回報為 skipped，GitHub 不因此擋合併，且不佔 runner。
  #   兩庫自必要檢查移除該項後，本 job 整段刪除。
  detect-simplified:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "本 job 不做任何檢查"

  llm-chokepoint:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: LLM Chokepoint Guard
        run: |
          python3 - <<'PY'
          import os, sys, re
          BAD = re.compile(r'anthropic\.Anthropic|Anthropic\(\)|client\.messages\.create|openai\.ChatCompletion')
          violations = []
          # 允許的 chokepoint 本體(api_utils / llm_client / 標 '# llm-chokepoint: allow' 者)
          CHOKEPOINTS = ('api_utils.py', 'llm_client.py')
          for root, _, files in os.walk('.'):
              if '.git' in root or 'api_utils' in root or '99_archive' in root or 'node_modules' in root or 'dev_scratch' in root:
                  continue
              for f in files:
                  if f.endswith('.py') and f not in CHOKEPOINTS:
                      content = open(os.path.join(root, f), encoding='utf-8', errors='ignore').read()
                      if '# llm-chokepoint: allow' in content:
                          continue  # 顯式允許例外(需 review)
                      if BAD.search(content):
                          violations.append(os.path.join(root, f))
          if violations:
              print('❌ 直接 LLM 呼叫（繞過 chokepoint）：', violations); sys.exit(1)
          print('✅ LLM Chokepoint 檢查通過')
          PY

  # GOVERNANCE_PLAN 波 2（2026-09-25）：秘密掃描實際執行（I4 secret_scan_executed）。做法同治理庫 secret_scan.yml。
  #   非必要檢查，不加入任何分支保護必要清單；有外洩即本 job 紅燈。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks（本次變更範圍）
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$SHA~1..$SHA"
          else
            RANGE="$BEFORE..$SHA"
          fi
          VER=8.18.4
          curl -sSL -o /tmp/gl.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks && sudo mv /tmp/gitleaks /usr/local/bin/
          CFG=""
          if [ -f .gitleaks.toml ]; then CFG="--config .gitleaks.toml"; fi
          if ! git cat-file -e "${RANGE%%..*}^{commit}" 2>/dev/null; then RANGE="$SHA"; fi
          gitleaks detect $CFG --log-opts="$RANGE" --redact -v --exit-code 1
