name: Reusable Data Quality Check (Grade C - 資料 repo)
on:
  workflow_call:

concurrency:
  group: data-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ★2026-09-18 L0 裁示：原 detect-simplified（簡體字 grep，本工作流唯一檢查）已拆除，
  #   字形檢查只在治理庫交付出口 00_governance/delivery_exit/convert_and_check。
  #   本工作流目前**無任何檢查項**。保留一個恆略過之 job，只為使呼叫端
  #   （prospera-data-architecture、prospera-infra-registry 之 ci.yml）仍為合法工作流；
  #   `if: false` ⇒ 不佔 runner、不計 Actions 分鐘。
  no-checks:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "本工作流無檢查項"
