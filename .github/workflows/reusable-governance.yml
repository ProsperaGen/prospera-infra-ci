name: Reusable Governance Check (Grade B - 治理 repo)
on:
  workflow_call:

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-check:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # ★2026-09-18 L0 裁示：原「繁體中文強制閘」（簡體字 grep）已拆除，
      #   字形檢查只在治理庫交付出口 00_governance/delivery_exit/convert_and_check。
      # 序52（L0 Kevin 2026-09-16，TIER0_BATCH_2026-07-17_KCARDS 卡5 選 A）：
      #   我方庫＝有格式問題即結束碼 1（擋下）；客戶庫與客戶範本＝維持只印警告（記錄級）。
      # 判斷依據＝GITHUB_REPOSITORY（Actions 預設環境變數，值同 github.repository；
      #   reusable workflow 內為「呼叫端」庫名）。不在 run 內插 ${{ }}，避免表達式注入。
      # ★命名依賴風險：客戶判定純靠庫名。prospera-client-prosperagen（我方租戶）會被當客戶放行；
      #   日後不以 prospera-client- 命名之客戶庫會被擋。名單變更須同步改 scripts/governance_check.py。
      - name: PENDING 格式閘（我方庫擋下／客戶庫記錄級）
        run: |
          python3 - <<'PY'
          import os, re, sys
          # ── 客戶庫名單（SSOT＝infra-ci scripts/governance_check.py 同名常數；
          #    兩處須逐字一致，tests/test_own_repo_blocking.py 守漂移）──
          CLIENT_REPO_PREFIXES = ("prosperagen/prospera-client-",)
          CLIENT_REPO_EXACT = frozenset({"prosperagen/prospera-product-client-template"})
          def is_client_repo(repo):
              # 空字串／未設定＝非客戶＝擋（fail-closed：判準失效時寧可誤擋我方，不可誤放）
              r = (repo or "").strip().casefold()
              return bool(r) and (r.startswith(CLIENT_REPO_PREFIXES) or r in CLIENT_REPO_EXACT)
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          # 2026-09-25（Kevin 指示）：接受 PENDING-<三位數字> 與 PENDING-<代號>-<三位數字>（代號 2～5 個大寫英文字母，例 PENDING-ART-031）。
          #   ★本檢查只查格式，不查該待辦是否存在（代號拼錯如 PENDING-AR-031 格式合法即通過）；
          #   ★代號與治理庫待辦前綴相同不視為撞號（完整編號含代號）；小寫代號被拒並提示改用大寫。
          # 2026-09-25 再放寬（Kevin 指示，不改既有編號）：另涵蓋治理庫登記簿既有三種寫法——
          #   單字母＋兩位數（PENDING-Y01）、代號－兩字母－兩位數（PENDING-GENPACE-IP-01）、代號－英文字（PENDING-CLAUDE-UPDATE）。
          #   仍拒絕 PENDING-31、PENDING-ART-31 與小寫代號。
          VALID_PENDING = re.compile(r'PENDING-(?:\d{3}(?!\d)|[A-Z]{2,5}-\d{3}(?!\d)|[A-Z]\d{2}(?!\d)|[A-Z]{2,7}-[A-Z]{2}-\d{2}(?!\d)|[A-Z]{2,7}-[A-Z]{2,7}(?![A-Za-z0-9]))')
          LOWER_CODE = re.compile(r'PENDING-[a-z]{2,5}-\d{3}(?!\d)')
          issues = []
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if f.endswith('.md'):
                      content = open(os.path.join(root, f), encoding='utf-8', errors='ignore').read()
                      for m in re.finditer(r'PENDING-', content):
                          if not VALID_PENDING.match(content, m.start()):
                              tok = (content[m.start():m.start() + 24].split() or ['PENDING-'])[0]
                              hint = '（代號須為大寫英文字母）' if LOWER_CODE.match(content, m.start()) else ''
                              issues.append(f'{f}: {tok}{hint}')
          if not issues:
              print('✅ PENDING 格式檢查通過')
          elif is_client_repo(repo):
              print('⚠️ PENDING 格式警告（客戶庫，記錄級不擋）：', repo, issues)
          else:
              print('❌ PENDING 格式違規（我方庫，擋下）：', repo or '<GITHUB_REPOSITORY 未設定>', issues)
              print('   格式須為 PENDING-<三位數字>（例 PENDING-031）、PENDING-<2～5 個大寫英文字母代號>-<三位數字>（例 PENDING-ART-031），或治理庫既有之 PENDING-Y01、PENDING-GENPACE-IP-01、PENDING-CLAUDE-UPDATE 寫法；本檢查只查格式，不查待辦是否存在')
              sys.exit(1)
          PY

  # GOVERNANCE_PLAN 波 2（2026-09-25）：秘密掃描實際執行（I4 secret_scan_executed）。做法同治理庫 secret_scan.yml。
  #   非必要檢查，不加入任何分支保護必要清單；有外洩即本 job 紅燈。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks（本次變更範圍）
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$SHA~1..$SHA"
          else
            RANGE="$BEFORE..$SHA"
          fi
          VER=8.18.4
          curl -sSL -o /tmp/gl.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks && sudo mv /tmp/gitleaks /usr/local/bin/
          CFG=""
          if [ -f .gitleaks.toml ]; then CFG="--config .gitleaks.toml"; fi
          if ! git cat-file -e "${RANGE%%..*}^{commit}" 2>/dev/null; then RANGE="$SHA"; fi
          gitleaks detect $CFG --log-opts="$RANGE" --redact -v --exit-code 1
