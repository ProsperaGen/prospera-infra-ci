# ── Prospera SYSTEM HEADER (ADR-0032/SBOM) ──
# 標準 dependabot（ADR-0249 P4-C）：monthly + groups "*" + limit 3。
# dependabot PR 只跑 L0 lint、不觸發治理層（reusable/thin-caller 內 if actor!=dependabot[bot]）。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-pip:
        patterns: ["*"]
    open-pull-requests-limit: 3
